[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-lab-five-assets"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=16", "matplotlib>=3.8", "pyyaml>=6", "scipy>=1.12", "scikit-learn>=1.4", "filelock>=3", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
wrds = ["psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
