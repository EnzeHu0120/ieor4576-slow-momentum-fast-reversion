[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-lab"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=16", "matplotlib>=3.8", "pyyaml>=6",
    "scipy>=1.12", "scikit-learn>=1.4", "numba>=0.60", "torch>=2.4",
    "psycopg2-binary>=2.9", "nbformat>=5.10", "nbclient>=0.10", "nbconvert>=7.16",
    "ipykernel>=6", "reportlab>=4", "filelock>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
wrds = ["psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
